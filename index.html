<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <title>Coniugare</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div class="brand">
          <img class="brand-icon" src="icon.svg" alt="" aria-hidden="true" />
          <div class="brand-title">
            <h1>coniugare</h1>
            <p class="tagline" aria-label="italian verb conjugation quiz">
              <span class="tagline-before">italian</span>
              <span class="tagline-after">verb conjugation quiz</span>
            </p>
          </div>
        </div>

        <div class="picker-bar" aria-label="Quiz settings">
          <details id="verbPicker" class="picker">
            <summary>
              <span>Verbs</span>
              <strong id="verbCount">0 selected</strong>
            </summary>
            <div class="picker-menu">
              <input id="verbSearch" class="search" type="search" placeholder="Search English or Italian verbs…" autocomplete="off" />
              <div class="quick-actions" aria-label="Verb selection actions">
                <button id="checkedVerbsOnly" class="filter-button" type="button" aria-pressed="false">Checked</button>
                <button id="selectAllVerbs" type="button">All</button>
                <button id="clearVerbs" type="button">Clear</button>
              </div>
              <div id="verbList" class="choice-list" role="listbox" aria-multiselectable="true"></div>
              <button id="doneVerbs" class="done-button primary" type="button">Done</button>
            </div>
          </details>

          <details id="formPicker" class="picker">
            <summary>
              <span>Forms</span>
              <strong id="formCount">0 selected</strong>
            </summary>
            <div class="picker-menu">
              <input id="formSearch" class="search" type="search" placeholder="Search English or Italian forms…" autocomplete="off" />
              <div class="quick-actions" aria-label="Form selection actions">
                <button id="selectAllForms" type="button">All</button>
                <button id="clearForms" type="button">Clear</button>
              </div>
              <div id="formList" class="choice-list" role="listbox" aria-multiselectable="true"></div>
              <button id="doneForms" class="done-button primary" type="button">Done</button>
            </div>
          </details>

          <div id="promptLanguage" class="prompt-toggle" role="group" aria-label="Prompt language" title="Switch prompt language">
            <button type="button" data-prompt-language="both">it+en</button>
            <button type="button" data-prompt-language="it">it</button>
            <button type="button" data-prompt-language="en">en</button>
          </div>
        </div>
      </header>

      <section class="quiz-panel" aria-label="Conjugation quiz">
        <div class="quiz-toolbar">
          <div>
            <h2 id="quizTitle">Ready?</h2>
            <p id="quizSubtitle" class="muted">Choose at least one verb and one form to start.</p>
          </div>
          <div class="round-actions" aria-label="Round actions">
            <button id="clearAnswers" class="icon-button" type="button" title="Clear entries" aria-label="Clear entries">↻</button>
            <button id="nextRound" class="icon-button" type="button" title="Next verb" aria-label="Next verb">→</button>
          </div>
        </div>

        <form id="quizForm" class="answer-grid" autocomplete="off"></form>

        <div class="result-bar" aria-live="polite">
          <div>
            <strong id="scoreText" hidden></strong>
            <p id="hintText" class="muted"></p>
          </div>
          <button id="checkAnswers" class="primary" type="button" title="Check answers">Controlla le risposte</button>
        </div>
      </section>

      <footer class="site-footer">
        <nav aria-label="Footer">
          <a id="contactLink" href="mailto:hello@coniugare.app">Contact</a>
          <a href="https://github.com/gnomesoup/coniugare" rel="noopener noreferrer">GitHub</a>
          <a href="legal.html#cookies">Cookies</a>
          <a href="legal.html#terms">Terms</a>
          <a href="legal.html#privacy">Privacy</a>
          <a href="LICENSE">License</a>
        </nav>
      </footer>
    </main>

    <script src="config.js"></script>
    <script src="verbs.js"></script>
    <script src="conjugation.js"></script>
    <script src="app.js"></script>
  </body>
</html>
